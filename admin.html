<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — DonMatii's Lunar Tarot</title>
    <link rel="icon" type="image/webp" href="./IMG/Logo-3.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/variables.css" />
    <link rel="stylesheet" href="./assets/css/base.css" />
    <link rel="stylesheet" href="./assets/css/admin.css" />
</head>

<body>
    <!-- LOGIN STATE -->
    <div id="login-view" class="admin-container">
        <div class="admin-login-card">
            <div class="admin-logo">🌙</div>
            <h1>Panel de Administración</h1>
            <p>Solo para administradores autorizados</p>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required autocomplete="email" />
                <input type="password" id="login-password" placeholder="Contraseña" required
                    autocomplete="current-password" />
                <button type="submit">Iniciar Sesión</button>
            </form>
            <div id="login-error" class="error-msg"></div>
        </div>
    </div>

    <!-- DASHBOARD STATE (hidden by default) -->
    <div id="dashboard-view" class="admin-container" style="display: none;">
        <header class="admin-header">
            <h1>🌙 Panel de Administración</h1>
            <div class="admin-user-info">
                <span id="admin-email"></span>
                <button id="logout-btn">Cerrar Sesión</button>
            </div>
        </header>

        <div class="admin-stats">
            <div class="stat-card">
                <span id="stat-total">0</span>
                <p>Total Testimonios</p>
            </div>
            <div class="stat-card">
                <span id="stat-avg">0</span>
                <p>Promedio Estrellas</p>
            </div>
        </div>

        <div id="testimonials-list" class="admin-testimonials"></div>
    </div>

    <script type="module" src="./assets/js/admin.js"></script>
</body>

</html>
