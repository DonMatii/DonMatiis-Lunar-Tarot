<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — DonMatii's Lunar Tarot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <style>
        /* Admin Panel Styles */
        .admin-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .admin-login-card {
            background: var(--bg-card);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .admin-logo {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .admin-login-card h1 {
            font-family: 'Cinzel', serif;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .admin-login-card p {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .admin-login-card input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            background: var(--bg-secondary);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .admin-login-card input:focus {
            border-color: var(--accent-purple);
        }

        .admin-login-card input::placeholder {
            color: var(--text-muted);
        }

        .admin-login-card button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-light));
            border: none;
            border-radius: 12px;
            color: var(--white);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .admin-login-card button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--accent-glow);
        }

        .error-msg {
            color: #ff6b6b;
            margin-top: 16px;
            display: none;
        }

        /* Dashboard */
        #dashboard-view {
            justify-content: flex-start;
            padding-top: 40px;
        }

        .admin-header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .admin-header h1 {
            font-family: 'Cinzel', serif;
            color: var(--text-main);
            font-size: 1.5rem;
        }

        .admin-user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .admin-user-info span {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        #logout-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--accent-purple);
            border-radius: 8px;
            color: var(--accent-light);
            cursor: pointer;
            transition: all 0.2s;
        }

        #logout-btn:hover {
            background: var(--accent-purple);
            color: var(--white);
        }

        .admin-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 900px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(157, 78, 221, 0.2);
            border-radius: 16px;
            padding: 24px;
            flex: 1;
            text-align: center;
        }

        .stat-card span {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-light);
            font-family: 'Cinzel', serif;
        }

        .stat-card p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 0.9rem;
        }

        .admin-testimonials {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        .admin-testimonial-card {
            background: var(--bg-card);
            border: 1px solid rgba(157, 78, 221, 0.2);
            border-radius: 16px;
            padding: 20px;
            transition: border-color 0.3s;
        }

        .admin-testimonial-card:hover {
            border-color: rgba(157, 78, 221, 0.4);
        }

        .admin-testimonial-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .admin-testimonial-name {
            font-weight: 600;
            color: var(--text-main);
        }

        .admin-testimonial-date {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .admin-testimonial-email {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .admin-testimonial-stars {
            color: var(--gold);
            margin-bottom: 8px;
        }

        .admin-testimonial-message {
            color: var(--text-main);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .admin-testimonial-actions {
            display: flex;
            gap: 12px;
        }

        .admin-testimonial-actions button {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-edit {
            background: rgba(157, 78, 221, 0.2);
            color: var(--accent-light);
            border: 1px solid var(--accent-purple) !important;
        }

        .btn-edit:hover {
            background: var(--accent-purple);
            color: var(--white);
        }

        .btn-delete {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b !important;
        }

        .btn-delete:hover {
            background: #ff6b6b;
            color: var(--white);
        }

        /* Edit mode */
        .edit-textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--accent-purple);
            border-radius: 8px;
            color: var(--text-main);
            font-family: inherit;
            resize: vertical;
            margin-bottom: 12px;
        }

        .edit-rating-select {
            padding: 8px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--accent-purple);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .edit-actions {
            display: flex;
            gap: 12px;
        }

        .btn-save {
            padding: 8px 16px;
            background: var(--accent-purple);
            color: var(--white);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-cancel {
            padding: 8px 16px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 12px;
            color: var(--white);
            font-weight: 500;
            z-index: 10000;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s;
            max-width: 320px;
        }

        .toast-success {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .toast-error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-stats {
                flex-direction: column;
            }

            .admin-testimonial-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .admin-testimonial-actions {
                flex-direction: column;
            }

            .admin-testimonial-actions button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- LOGIN STATE -->
    <div id="login-view" class="admin-container">
        <div class="admin-login-card">
            <div class="admin-logo">🌙</div>
            <h1>Panel de Administración</h1>
            <p>Solo para administradores autorizados</p>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required autocomplete="email" />
                <input type="password" id="login-password" placeholder="Contraseña" required
                    autocomplete="current-password" />
                <button type="submit">Iniciar Sesión</button>
            </form>
            <div id="login-error" class="error-msg"></div>
        </div>
    </div>

    <!-- DASHBOARD STATE (hidden by default) -->
    <div id="dashboard-view" class="admin-container" style="display: none;">
        <header class="admin-header">
            <h1>🌙 Panel de Administración</h1>
            <div class="admin-user-info">
                <span id="admin-email"></span>
                <button id="logout-btn">Cerrar Sesión</button>
            </div>
        </header>

        <div class="admin-stats">
            <div class="stat-card">
                <span id="stat-total">0</span>
                <p>Total Testimonios</p>
            </div>
            <div class="stat-card">
                <span id="stat-avg">0</span>
                <p>Promedio Estrellas</p>
            </div>
        </div>

        <div id="testimonials-list" class="admin-testimonials"></div>
    </div>

    <script type="module" src="./assets/js/admin.js"></script>
</body>

</html>
