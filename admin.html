<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — DonMatii's Lunar Tarot</title>
    <link rel="icon" type="image/webp" href="./IMG/Logo-3.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <style>
        /* Admin Panel Styles */
        .admin-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Decorative stars background */
        .admin-container::before {
            content: '✦ ✧ ★ ✦ ✧ ★ ✦ ✧';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            color: rgba(199, 125, 255, 0.2);
            letter-spacing: 20px;
            white-space: nowrap;
            pointer-events: none;
        }

        .admin-container::after {
            content: '✦ ✧ ★ ✦ ✧ ★ ✦ ✧';
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            color: rgba(199, 125, 255, 0.2);
            letter-spacing: 20px;
            white-space: nowrap;
            pointer-events: none;
        }

        .admin-login-card {
            background: linear-gradient(145deg, var(--bg-card) 0%, #1a0f2e 100%);
            border: 1px solid rgba(157, 78, 221, 0.4);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(157, 78, 221, 0.2), 0 0 100px rgba(157, 78, 221, 0.1);
            position: relative;
            overflow: hidden;
        }

        .admin-login-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(199, 125, 255, 0.03) 0%, transparent 70%);
            pointer-events: none;
        }

        .admin-logo {
            font-size: 4.5rem;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .admin-login-card h1 {
            font-family: 'Cinzel', serif;
            color: var(--text-main);
            margin-bottom: 8px;
            font-size: 1.6rem;
            letter-spacing: 1px;
        }

        .admin-login-card p {
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        .admin-login-card input {
            width: 100%;
            padding: 16px 18px;
            margin-bottom: 16px;
            background: rgba(26, 16, 46, 0.8);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .admin-login-card input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.2);
            background: rgba(26, 16, 46, 1);
        }

        .admin-login-card input::placeholder {
            color: var(--text-muted);
        }

        .admin-login-card button[type="submit"] {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-light));
            border: none;
            border-radius: 14px;
            color: var(--white);
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .admin-login-card button[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        .error-msg {
            color: #ff6b6b;
            margin-top: 20px;
            display: none;
            padding: 12px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        /* Dashboard */
        #dashboard-view {
            justify-content: flex-start;
            padding-top: 40px;
        }

        .admin-header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(157, 78, 221, 0.2);
        }

        .admin-header h1 {
            font-family: 'Cinzel', serif;
            color: var(--text-main);
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        .admin-user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .admin-user-info span {
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 8px 16px;
            background: rgba(157, 78, 221, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(157, 78, 221, 0.2);
        }

        #logout-btn {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid rgba(255, 107, 107, 0.5);
            border-radius: 10px;
            color: #ff6b6b;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        #logout-btn:hover {
            background: rgba(255, 107, 107, 0.1);
            border-color: #ff6b6b;
        }

        .admin-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 900px;
        }

        .stat-card {
            background: linear-gradient(145deg, var(--bg-card) 0%, #1a0f2e 100%);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 20px;
            padding: 28px;
            flex: 1;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(157, 78, 221, 0.15);
        }

        .stat-card span {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--accent-light);
            font-family: 'Cinzel', serif;
            display: block;
            margin-bottom: 8px;
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .admin-testimonials {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
        }

        .admin-testimonial-card {
            background: linear-gradient(145deg, var(--bg-card) 0%, #1a0f2e 100%);
            border: 1px solid rgba(157, 78, 221, 0.25);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .admin-testimonial-card:hover {
            border-color: rgba(157, 78, 221, 0.5);
            box-shadow: 0 12px 36px rgba(157, 78, 221, 0.15);
        }

        .admin-testimonial-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .admin-testimonial-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 1.05rem;
        }

        .admin-testimonial-date {
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 4px 12px;
            background: rgba(157, 78, 221, 0.1);
            border-radius: 6px;
        }

        .admin-testimonial-email {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-testimonial-email i {
            color: var(--accent-light);
            font-size: 0.8rem;
        }

        .admin-testimonial-stars {
            color: var(--gold);
            margin-bottom: 12px;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .admin-testimonial-message {
            color: var(--text-main);
            line-height: 1.7;
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(26, 16, 46, 0.5);
            border-radius: 12px;
            border-left: 3px solid var(--accent-purple);
            font-style: italic;
        }

        .admin-testimonial-actions {
            display: flex;
            gap: 12px;
        }

        .admin-testimonial-actions button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-edit {
            background: rgba(157, 78, 221, 0.15);
            color: var(--accent-light);
            border: 1px solid rgba(157, 78, 221, 0.4) !important;
        }

        .btn-edit:hover {
            background: var(--accent-purple);
            color: var(--white);
            transform: translateY(-2px);
        }

        .btn-delete {
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3) !important;
        }

        .btn-delete:hover {
            background: #ff6b6b;
            color: var(--white);
            transform: translateY(-2px);
        }

        /* Edit mode */
        .edit-textarea {
            width: 100%;
            min-height: 100px;
            padding: 16px;
            background: rgba(26, 16, 46, 0.8);
            border: 1px solid rgba(157, 78, 221, 0.4);
            border-radius: 12px;
            color: var(--text-main);
            font-family: inherit;
            resize: vertical;
            margin-bottom: 16px;
            line-height: 1.6;
            transition: all 0.2s;
        }

        .edit-textarea:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.15);
        }

        .edit-rating-select {
            padding: 12px 16px;
            background: rgba(26, 16, 46, 0.8);
            border: 1px solid rgba(157, 78, 221, 0.4);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .edit-rating-select:focus {
            outline: none;
            border-color: var(--accent-purple);
        }

        .edit-actions {
            display: flex;
            gap: 12px;
        }

        .btn-save {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-light));
            color: var(--white);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .btn-cancel {
            padding: 12px 24px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-cancel:hover {
            background: rgba(157, 78, 221, 0.1);
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 12px;
            color: var(--white);
            font-weight: 500;
            z-index: 10000;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s;
            max-width: 320px;
        }

        .toast-success {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .toast-error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-stats {
                flex-direction: column;
            }

            .admin-testimonial-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .admin-testimonial-actions {
                flex-direction: column;
            }

            .admin-testimonial-actions button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- LOGIN STATE -->
    <div id="login-view" class="admin-container">
        <div class="admin-login-card">
            <div class="admin-logo">🌙</div>
            <h1>Panel de Administración</h1>
            <p>Solo para administradores autorizados</p>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required autocomplete="email" />
                <input type="password" id="login-password" placeholder="Contraseña" required
                    autocomplete="current-password" />
                <button type="submit">Iniciar Sesión</button>
            </form>
            <div id="login-error" class="error-msg"></div>
        </div>
    </div>

    <!-- DASHBOARD STATE (hidden by default) -->
    <div id="dashboard-view" class="admin-container" style="display: none;">
        <header class="admin-header">
            <h1>🌙 Panel de Administración</h1>
            <div class="admin-user-info">
                <span id="admin-email"></span>
                <button id="logout-btn">Cerrar Sesión</button>
            </div>
        </header>

        <div class="admin-stats">
            <div class="stat-card">
                <span id="stat-total">0</span>
                <p>Total Testimonios</p>
            </div>
            <div class="stat-card">
                <span id="stat-avg">0</span>
                <p>Promedio Estrellas</p>
            </div>
        </div>

        <div id="testimonials-list" class="admin-testimonials"></div>
    </div>

    <script type="module" src="./assets/js/admin.js"></script>
</body>

</html>
