<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión — DonMatii's Lunar Tarot</title>
    <link rel="icon" type="image/webp" href="./IMG/Logo-3.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            background-color: #130b20;
            color: #f3e8ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .offline-container {
            max-width: 420px;
        }

        .offline-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-family: "Cinzel", serif;
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 12px;
        }

        p {
            color: #d8b4fe;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .offline-hint {
            font-size: 0.85rem;
            color: #d8b4fe;
            opacity: 0.7;
            margin-top: 30px;
            font-style: italic;
        }

        .retry-btn {
            background: linear-gradient(135deg, #9d4edd, #c77dff);
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(199, 125, 255, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(199, 125, 255, 0.4);
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #c77dff;
            margin-bottom: 24px;
            box-shadow: 0 0 30px rgba(199, 125, 255, 0.25);
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <img src="IMG/Logo-3.webp" alt="DonMatii's Lunar Tarot" class="logo" />
        <div class="offline-icon">🌙</div>
        <h1>Los arcanos necesitan conexión</h1>
        <p>
            Parece que no tienes conexión a internet en este momento.
            Cuando la tengas de vuelta, vuelve a intentar y los mensajes del universo te esperarán.
        </p>
        <button class="retry-btn" onclick="window.location.reload()">
            Reintentar conexión
        </button>
        <p class="offline-hint">📱 Puedes instalar la app para tener los arcanos siempre a mano</p>
    </div>
</body>
</html>
